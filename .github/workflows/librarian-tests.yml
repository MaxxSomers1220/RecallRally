name: Librarian game checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'librarian/**'
      - 'tests/librarian*'
      - 'amplify.yml'
      - '.github/workflows/librarian-tests.yml'
  push:
    branches: [feature/librarian-multiple-choice-v4]
jobs:
  javascript-and-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/librarian-v4-smoke.test.cjs
