version: 1
frontend:
  phases:
    build:
      commands:
        - node tests/home-launcher.test.cjs
        - node tests/science-lab.test.cjs
        - node tests/adventure-save.test.cjs
        - node tests/bank-v29.test.cjs
        - node tests/worlds.test.cjs
        - node tests/adventure-effects.test.cjs
        - node tests/librarian-v4-smoke.test.cjs
        - mkdir -p dist/librarian
        - cp index.html dist/index.html
        - cp librarian/librarian.css librarian/librarian.js dist/librarian/
        - node scripts/inject-librarian.cjs dist/index.html
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
